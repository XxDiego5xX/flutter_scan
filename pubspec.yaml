name: scan
description: Modernized fork of the original scan plugin. Updated for Flutter 3 and Dart 3 compatibility.
version: 2.0.0
homepage: https://github.com/XxDiego5xX/flutter_scan
repository: https://github.com/XxDiego5xX/flutter_scan
issue_tracker: https://github.com/XxDiego5xX/flutter_scan/issues

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  barcode_scan2: ^4.7.2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.chavesgu.scan
        pluginClass: ScanPlugin
      ios:
        pluginClass: ScanPlugin
